[build]
  command = "npm run build"
  publish = "dist"

# Security headers sent with every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
        Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-BkKP2XO6WOEc3kXOiLr2ZoY83hamalKjPY9xBcbXVuw='; connect-src 'self' https://*.onrender.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'"
